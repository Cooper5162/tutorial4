name: Build with Maven

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        java-version: '1.8'  # 匹配 pom.xml 的 Java 1.8
        distribution: 'adopt'
    - name: Run tests
      run: mvn clean test
      working-directory: .  # 指向根目录，包含 pom.xml
